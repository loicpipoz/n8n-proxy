name: n8n-proxy

services:
  tailscale:
    image: tailscale/tailscale:${TAILSCALE_VERSION:-latest}
    container_name: n8n-proxy-tailscale
    hostname: ${TAILSCALE_HOSTNAME:-n8n-proxy}
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 9.9.9.9
    environment:
      TS_AUTHKEY: "${TS_AUTHKEY:?Set TS_AUTHKEY in .env}"
      TS_STATE_DIR: /var/lib/tailscale
      TAILSCALE_HOSTNAME: "${TAILSCALE_HOSTNAME:-n8n-proxy}"
      TS_EXTRA_ARGS: "${TS_EXTRA_ARGS:---advertise-tags=tag:webhook-proxy --accept-dns=true}"
    entrypoint: /bin/sh
    command:
      - -ec
      - |
        mkdir -p "$${TS_STATE_DIR}" /var/run/tailscale
        tailscaled \
          --state="$${TS_STATE_DIR}/tailscaled.state" \
          --socket=/var/run/tailscale/tailscaled.sock &
        tailscaled_pid="$$!"
        trap 'kill "$${tailscaled_pid}"; wait "$${tailscaled_pid}"' INT TERM
        until [ -S /var/run/tailscale/tailscaled.sock ]; do sleep 0.2; done
        tailscale --socket=/var/run/tailscale/tailscaled.sock up \
          --authkey="$${TS_AUTHKEY}" \
          --hostname="$${TAILSCALE_HOSTNAME}" \
          $${TS_EXTRA_ARGS}
        wait "$${tailscaled_pid}"
    volumes:
      - tailscale-state:/var/lib/tailscale
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${HTTPS_BIND:-0.0.0.0}:${HTTPS_PORT:-443}:443"
      # Caddy terminates legacy RustDesk API TLS inside this shared network
      # namespace. Public :21114 is redirected to this host-only shim port.
      - "${RUSTDESK_TLS_SHIM_BIND:-0.0.0.0}:${RUSTDESK_TLS_SHIM_PORT:-22114}:21114"

  caddy:
    image: caddy:2-alpine
    container_name: n8n-proxy-caddy
    restart: unless-stopped
    network_mode: service:tailscale
    depends_on:
      - tailscale
    environment:
      PUBLIC_DOMAIN: "${PUBLIC_DOMAIN:?Set PUBLIC_DOMAIN in .env}"
      CADDY_SITE_ADDRESS: "${CADDY_SITE_ADDRESS:-${PUBLIC_DOMAIN:?Set PUBLIC_DOMAIN in .env}}"
      N8N_UPSTREAM_URL: "${N8N_UPSTREAM_URL:?Set N8N_UPSTREAM_URL in .env}"
      N8N_UPSTREAM_HOST: "${N8N_UPSTREAM_HOST:?Set N8N_UPSTREAM_HOST in .env}"
      N8N_UPSTREAM_TLS_SERVER_NAME: "${N8N_UPSTREAM_TLS_SERVER_NAME:?Set N8N_UPSTREAM_TLS_SERVER_NAME in .env}"
      WEBHOOK_METHODS: "${WEBHOOK_METHODS:-POST}"
      WEBHOOK_PATHS: "${WEBHOOK_PATHS:-/webhook/*}"
      FORM_METHODS: "${FORM_METHODS:-GET POST}"
      FORM_PATHS: "${FORM_PATHS:-/form/* /form-test/* /form-waiting/*}"
      ALLOWED_SOURCE_CIDRS: "${ALLOWED_SOURCE_CIDRS:-0.0.0.0/0 ::/0}"
      NPM_EDGE_KEY: "${NPM_EDGE_KEY:-}"
      TRUSTED_PROXY_CIDRS: "${TRUSTED_PROXY_CIDRS:-127.0.0.1/32}"
      N8N_ORIGIN_CERT_FILE: "${N8N_ORIGIN_CERT_FILE:-/etc/caddy/origin/n8n-wh01.pem}"
      N8N_ORIGIN_KEY_FILE: "${N8N_ORIGIN_KEY_FILE:-/etc/caddy/origin/n8n-wh01.key}"
      N8N_PUBLIC_CERT_FILE: "${N8N_PUBLIC_CERT_FILE:-/etc/caddy/origin/n8n-wh01-public.pem}"
      N8N_PUBLIC_KEY_FILE: "${N8N_PUBLIC_KEY_FILE:-/etc/caddy/origin/n8n-wh01-public.key}"
      RUSTDESK_SITE_ADDRESS: "${RUSTDESK_SITE_ADDRESS:-rd01.spiritviews.com}"
      RUSTDESK_WEB_UPSTREAM: "${RUSTDESK_WEB_UPSTREAM:-http://host.docker.internal:21114}"
      RUSTDESK_ID_WS_UPSTREAM: "${RUSTDESK_ID_WS_UPSTREAM:-http://host.docker.internal:21118}"
      RUSTDESK_RELAY_WS_UPSTREAM: "${RUSTDESK_RELAY_WS_UPSTREAM:-http://host.docker.internal:21119}"
      RUSTDESK_CERT_FILE: "${RUSTDESK_CERT_FILE:-/etc/caddy/origin/rd01.pem}"
      RUSTDESK_KEY_FILE: "${RUSTDESK_KEY_FILE:-/etc/caddy/origin/rd01.key}"
      MAX_BODY_SIZE: "${MAX_BODY_SIZE:-10MB}"
      CADDY_LOG_DIR: "${CADDY_LOG_DIR:-/var/log/caddy}"
    volumes:
      - ./config/${CADDY_CONFIG_FILE:-Caddyfile}:/etc/caddy/Caddyfile:ro
      - ./config/includes:/etc/caddy/includes:ro
      - ${CADDY_ORIGIN_CERT_DIR:-./secrets/origin}:/etc/caddy/origin:ro
      - ./logs:/var/log/caddy
      - caddy-data:/data
      - caddy-config:/config

volumes:
  tailscale-state:
  caddy-data:
  caddy-config:
