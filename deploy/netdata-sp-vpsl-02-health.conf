template: spiritviews_public_endpoint_availability
      on: httpcheck.status
   class: Errors
    type: Web Server
component: HTTP endpoint
  lookup: average -1m unaligned percentage of success
   every: 10s
   units: %
    warn: $this < 100
    crit: $this < 50
   delay: up 30s down 2m multiplier 1.5 max 30m
 summary: Public endpoint ${label:url} availability
    info: Successful requests to ${label:url} during the last minute
      to: sysadmin

template: spiritviews_cpu_iowait
      on: system.cpu
   class: Utilization
    type: System
component: CPU
host labels: _os=linux
  lookup: average -5m unaligned of iowait
   every: 1m
   units: %
    warn: $this > (($status >= $WARNING) ? (15) : (20))
    crit: $this > (($status == $CRITICAL) ? (40) : (50))
   delay: up 2m down 10m multiplier 1.5 max 1h
 summary: Sustained CPU iowait
    info: Average CPU iowait over the last five minutes
      to: sysadmin

   alarm: spiritviews_disk_read_await
      on: disk_await.sda
   class: Latency
    type: System
component: Disk
  lookup: average -5m unaligned absolute of reads
   every: 1m
   units: ms
    warn: $this > (($status >= $WARNING) ? (15) : (20))
    crit: $this > (($status == $CRITICAL) ? (40) : (50))
   delay: up 2m down 10m multiplier 1.5 max 1h
 summary: Root disk sda read await
    info: Average read completion latency over the last five minutes
      to: sysadmin

   alarm: spiritviews_disk_write_await
      on: disk_await.sda
   class: Latency
    type: System
component: Disk
  lookup: average -5m unaligned absolute of writes
   every: 1m
   units: ms
    warn: $this > (($status >= $WARNING) ? (15) : (20))
    crit: $this > (($status == $CRITICAL) ? (40) : (50))
   delay: up 2m down 10m multiplier 1.5 max 1h
 summary: Root disk sda write await
    info: Average write completion latency over the last five minutes
      to: sysadmin

   alarm: spiritviews_disk_backlog
      on: disk_backlog.sda
   class: Latency
    type: System
component: Disk
  lookup: average -10m unaligned
   every: 1m
   units: ms
    warn: $this > (($status >= $WARNING) ? (4000) : (5000))
    crit: $this > (($status == $CRITICAL) ? (25000) : (30000))
   delay: up 1m down 15m multiplier 1.5 max 1h
 summary: Root disk sda backlog
    info: Average disk backlog over the last ten minutes
      to: sysadmin

template: spiritviews_expected_running_containers
      on: docker.containers_state
   class: Errors
    type: Containers
component: Docker
  lookup: average -1m unaligned of running
   every: 10s
   units: containers
    warn: $this < 4
    crit: $this < 3
   delay: up 1m down 2m multiplier 1.5 max 30m
 summary: Expected production containers are not running
    info: SP-VPSL-02 normally runs Caddy, Tailscale, hbbs and hbbr
      to: sysadmin
